name: CI

# Every gate in this file asserts it actually analysed something.
#
# That is not defensive style, it is this repo's history: api-diff scanned zero files and
# printed PASS for weeks; a bead validate: gate never fired for ~14 tasks; the Android
# emulator smoke has never once executed the APK; :core:test was NO-SOURCE and reported green
# forever until 2026-08-10; and Android Lint analysed 9 of 1077 files while looking clean. A gate that cannot
# be observed failing is not a gate.

on:
  push:
    branches: [ main, 'afk/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          # deletion-audit and manifest-audit walk history, so a shallow clone breaks them.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Must be 17: options.release = 8 needs a JDK whose ct.sym carries the Java 8 API
          # signatures, and Error Prone (when adopted) caps at 17 until its version is bumped.
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Compile the Java 8 modules
        # --rerun-tasks so a cache hit cannot masquerade as a successful compile.
        run: ./gradlew core:compileJava SPD-classes:compileJava desktop:compileJava --rerun-tasks

      - name: Prove options.release = 8 is actually applied
        # The gate silently applied to nothing when it was first written: reading
        # sourceCompatibility from a bare configureEach resolves before the subproject sets
        # it, so the flag was never set and the build went green with no gate at all.
        run: |
          cat > /tmp/probe.gradle <<'EOF'
          allprojects {
            tasks.withType(JavaCompile).configureEach { t ->
              t.doFirst { println "PROBE ${t.path} release=${t.options.release.getOrNull()}" }
            }
          }
          EOF
          ./gradlew -I /tmp/probe.gradle :core:compileJava --rerun-tasks | tee /tmp/probe.log
          grep -q 'PROBE :core:compileJava release=8' /tmp/probe.log \
            || { echo "::error::options.release is NOT applied to :core - the Java 8 API gate is inert"; exit 1; }

      - name: Tests
        run: ./gradlew core:test SPD-classes:test :services:tools:api-diff:test :services:tools:pack-smoke:test :services:tools:namespace-transform:test :services:tools:deletion-audit:test --rerun-tasks

      - name: Assert the test suites are not empty
        # A suite that runs zero tests passes. SPD-classes and the tools modules must each
        # report a non-zero test count or the "tests passed" claim is worthless.
        run: |
          fail=0
          for m in core SPD-classes services/tools/api-diff services/tools/pack-smoke \
                   services/tools/namespace-transform services/tools/deletion-audit; do
            dir="$m/build/test-results/test"
            if [ ! -d "$dir" ]; then echo "::error::no test results for $m"; fail=1; continue; fi
            n=$(grep -ho 'tests="[0-9]*"' "$dir"/TEST-*.xml 2>/dev/null \
                | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
            n=${n:-0}
            echo "$m -> $n tests"
            [ "$n" -gt 0 ] || { echo "::error::$m ran 0 tests"; fail=1; }
          done
          exit $fail

      - name: Guard against :core losing its test source set again
        # core:test was NO-SOURCE until 2026-08-10 and reported green forever across 1019
        # Java files. If the source set is ever removed, the assertion above would pass
        # vacuously on a missing directory, so check the directory itself.
        run: |
          if [ ! -d core/src/test ]; then
            echo "::error::core/src/test is gone - core:test is NO-SOURCE and gates nothing"
            exit 1
          fi
          echo "core test source set present"

      - name: Lint
        run: ./gradlew :core:lint :android:lint

      - name: Deletion audit
        # Files scanned must be non-zero. Zero means the git plumbing lost the repo root and
        # the audit is reporting clean because it looked at nothing - the original api-diff bug.
        run: |
          ./gradlew :services:tools:deletion-audit:run --quiet \
            --args="--base 7d9c139c8 --head HEAD --min-shrink 3 --allowlist services/tools/deletion-audit/reviewed-removals.txt --max-findings 0" \
            | tee /tmp/da.log || true
          scanned=$(grep -oP 'Files scanned: \K[0-9]+' /tmp/da.log || echo 0)
          echo "deletion-audit scanned $scanned files"
          [ "$scanned" -gt 0 ] || { echo "::error::deletion-audit scanned 0 files - it is inert"; exit 1; }
          grep -q 'RESULT: PASS' /tmp/da.log \
            || { echo "::error::deletion-audit found unreviewed removals"; exit 1; }

      - name: Manifest audit
        run: pwsh -NoProfile -File services/tools/manifest-audit/manifest-audit.ps1

      - name: Manifest audit canary
        # Proves the manifest checks can fail. Without this the PASS above means nothing.
        run: pwsh -NoProfile -File services/tools/manifest-audit/manifest-audit.ps1 -Canary

      - name: Marketplace pack smoke
        run: |
          ./gradlew packSmoke --quiet --args="--marketplace ./marketplace" | tee /tmp/ps.log
          grep -qE '29/29|29 .*GREEN' /tmp/ps.log \
            || { echo "::error::pack smoke did not report the expected 29 packs"; exit 1; }

      - name: Build desktop and Android
        run: ./gradlew desktop:release android:assembleDebug

      - name: Assert the artifacts exist and are plausibly sized
        # A build task can succeed and produce nothing useful.
        run: |
          jar=$(ls -S desktop/build/libs/*.jar 2>/dev/null | head -1)
          apk=$(ls -S android/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          [ -n "$jar" ] || { echo "::error::no desktop jar produced"; exit 1; }
          [ -n "$apk" ] || { echo "::error::no debug apk produced"; exit 1; }
          jarmb=$(( $(stat -c%s "$jar") / 1048576 ))
          apkmb=$(( $(stat -c%s "$apk") / 1048576 ))
          echo "desktop jar ${jarmb}MB, apk ${apkmb}MB"
          # Known good as of 2026-08-10: jar 54MB, apk 32MB. A tenth of that means the
          # asset pipeline silently dropped core/src/main/assets.
          [ "$jarmb" -gt 20 ] || { echo "::error::desktop jar is ${jarmb}MB, expected >20MB"; exit 1; }
          [ "$apkmb" -gt 10 ] || { echo "::error::apk is ${apkmb}MB, expected >10MB"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-and-reports
          path: |
            desktop/build/libs/*.jar
            android/build/outputs/apk/debug/*.apk
            core/build/reports/lint-results.html
            android/build/reports/lint-results-debug.html
          retention-days: 14

# NOT run here, deliberately:
#
#   desktop-smoke  needs a GL context. The xvfb path is plausible but untested, and a smoke
#                  test that silently degrades is the failure mode this repo already has.
#                  Stays a local pre-release gate until someone verifies xvfb works.
#   Android runtime  the emulator has never booted in this project's environment.
#                    reactivecircus/android-emulator-runner on a KVM-enabled runner may
#                    succeed where local does not - worth one experiment, not a silent add.
