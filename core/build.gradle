apply plugin: 'java-library'
apply plugin: 'kotlin'
apply plugin: 'kotlinx-serialization'
//Standalone Android Lint, shipped inside AGP. Needed because :core is a plain java-library,
//so :android's lint checkDependencies does NOT descend into it -- verified: with
//checkDependencies=true, lint analysed 9 android files and zero of core's 1068.
//This is also the only static analysis that reads the 49 Kotlin files, since options.release
//has no Kotlin equivalent.
apply plugin: 'com.android.lint'

lint {
    //No baseline: :core is genuinely clean. The 12 inherited DefaultLocale findings this
    //started with were fixed rather than parked, so there is nothing to hide behind and any
    //new violation fails immediately.
    //
    //Do NOT reintroduce a baseline to get past a failure. A baseline is a gate that lies by
    //construction -- it suppresses exactly what it records -- and regenerating one silently
    //forgives regressions. Fix the finding, or disable that specific check with a reason.
    abortOnError = true
    warningsAsErrors = true
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
sourceCompatibility = targetCompatibility = appJavaCompatibility

//:core had no test source set at all, so core:test was NO-SOURCE and reported green forever
//while 1019 Java + 49 Kotlin files went untested -- compilation was effectively the only gate.
//
//Tests here must NOT touch libGDX statics: Gdx.app/files/graphics are never initialised in a
//plain JVM test, and Gdx.gl is never available at all. Anything needing them requires the
//gdx-backend-headless bootstrap, which is a separate timeboxed spike. Pure logic, data
//classes and pure functions are fair game today.
test {
    useJUnitPlatform()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    api project(':SPD-classes')
    implementation project(':services')
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.5.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4"
    implementation "org.slf4j:slf4j-simple:1.7.25"
    implementation 'io.ktor:ktor-client-core-jvm:2.3.0'
    implementation 'io.ktor:ktor-client-okhttp-jvm:2.3.0'
    implementation 'io.ktor:ktor-client-logging-jvm:2.3.0'
    implementation 'io.ktor:ktor-client-content-negotiation:2.3.0'
    implementation 'io.ktor:ktor-serialization-kotlinx-json:2.3.0'
}

buildscript {
    ext.kotlin_version = '1.8.10'
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
    }
}

compileKotlin {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8

    kotlinOptions {
        jvmTarget = "1.8"
    }
}
